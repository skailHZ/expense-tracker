name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Юнит- и интеграционные тесты. Testcontainers сам поднимает PostgreSQL:
      # на ubuntu-latest Docker уже установлен, секреты для тестов не нужны (профиль test)
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Проверяем, что образ собирается (multi-stage Dockerfile), без публикации
      - name: Build Docker image
        run: docker build -t expense-tracker:ci .
