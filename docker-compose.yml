services:
  postgres:
    image: postgres:15
    container_name: tracker-postgres
    environment:
      # ${VAR:?msg} - compose откажется стартовать, если переменная не задана в .env
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: tracker_db
    ports:
      # Только localhost: база не должна быть доступна из сети
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Контейнер "запущен" еще не значит "готов принимать подключения"
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tracker_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: tracker-backend
    ports:
      - "8080:8080"
    environment:
      # Важно: стучимся к базе по имени контейнера "postgres"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracker_db
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        # Стартуем только после того, как база реально готова, а не просто запущена
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
