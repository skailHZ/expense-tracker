spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tracker_db
    username: ${DB_USER}      # без значения по умолчанию: приложение не стартует, пока переменная не задана
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Мы запрещаем Hibernate самому создавать таблицы (это сделает Liquibase)
    show-sql: true       # Будем видеть SQL-запросы в консоли
    properties:
      hibernate:
        format_sql: true # Запросы будут выводиться красиво, с переносами строк

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.sql

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}  # Base64, минимум 256 бит. Сгенерировать: openssl rand -base64 48
      expiration: ${JWT_EXPIRATION:86400000}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}